id: tiny
name: Tess
archetype: Tiny
behavior_class: BC03
language: en
summary: Answers in a few words.
trust_in_bot: normal
voice:
  register: terse
  vocabulary_level: everyday
  typical_phrases: ["yes"]
  never: []
  example_utterance: keep
modes: [panel, gauntlet]
gauntlet:
  reading_budget_words: 25
  fact_drift: 0.5
  patience:
    start: 6
    costs: {turn: 0.5}
    recovery: {}
    frustrated_below: 3
    angry_below: 1.5
  operators: []
panel:
  reading: {mode: skim, words_per_section: 12}
  attention_focus: ["button"]
  abandon_triggers: ["wall of text"]
fidelity:
  max_words: null
  require_script: any
  forbidden_words: []
